<tr><td class="content"><h3>白沙嶺親山徑校外教學行前提醒</h3>
<p class="small">公告日期：2003/07/03</p>
<p>請三年級學生攜帶水壺、帽子、輕便雨衣及午餐，並於導師指定時間到校集合。</p>
<p>活動期間請聽從老師及隊輔指示，不離開隊伍，不自行進入支線步道。</p></td></tr>
