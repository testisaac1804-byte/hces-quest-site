<tr><td class="content"><h3>歲末跳蚤市場活動通知</h3>
<p class="small">公告日期：2003/12/26</p>
<p>歲末跳蚤市場將於今日上午舉行，請學生將義賣物品清潔整理後交由導師彙整。活動所得將由家長會協助統一登記。</p>
<p>請勿攜帶危險物品、食品或已損壞器材。活動結束後，各班應將攤位及走廊恢復整潔。</p></td></tr>
