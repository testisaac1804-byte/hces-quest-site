<tr><td class="content"><h3>期末整理及寒假生活提醒</h3>
<p class="small">公告日期：2003/12/29</p>
<p>請各班於本週完成教室整理、圖書歸還及電源檢查。各班電燈、電扇、延長線及門窗請由導師確認後再離校。</p>
<p>寒假期間請同學注意交通安全，不單獨前往山區、溪邊及未開放校舍。若需返校取物，請先向導師或學務處登記。</p></td></tr>
