<tr><td class="content"><h3>學生健康檢查通知</h3>
<p class="small">公告日期：2003/10/03</p>
<p>本校將配合溪埕衛生所進行學生健康檢查，請各班導師協助收齊家長同意書。</p>
<p>檢查當日請學生穿著方便檢查之服裝，若近期已在院所檢查，請家長提供相關證明給導師。</p></td></tr>
