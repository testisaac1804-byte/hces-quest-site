<tr><td class="content"><h3>北側校舍部分區域暫停使用</h3>
<p class="small">公告日期：2003/09/15</p>
<p>本校北側校舍部分空間因設備檢修及動線安全考量，自即日起暫停使用。電腦課改至自然教室進行，復用時間另行公告。</p>
<p>請學生不要穿越臨時圍線或進入後方通道。導護老師將於下課時間協助巡視。</p>
<p>附件：<a href="map_0915.html">校園動線調整圖</a></p></td></tr>
