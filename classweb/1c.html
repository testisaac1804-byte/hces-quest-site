<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"><html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>一年丙班班級網頁登入</title></head><body bgcolor="#ffffff"><h3>一年丙班班級網頁登入</h3><p>請輸入帳號及密碼。</p><form id="sqform" method="get" action="" onsubmit="return sqLogin(event);">帳號：<input id="squser" type="text" name="username" size="14" autocomplete="username"><br><br>密碼：<input id="sqpw" type="password" name="password" size="14" autocomplete="current-password"> <input type="submit" value="登入"></form><script>
function sqLogin(e){
  e.preventDefault();
  var p = document.getElementById('sqpw').value;
  var u = document.getElementById('squser').value;
  if (p === 'happyland92' && u.toLowerCase() === '6b') {
    document.getElementById('sqform').style.display='none';
    var ok = document.getElementById('sqok');
    ok.style.display='block';
    return false;
  }
  alert('密碼錯誤 — 提示：班網名稱 + 民國年（日記第七章：注意小寫 l）');
  return false;
}
</script>
<div id="sqok" style="display:none;font-family:monospace;line-height:1.9;max-width:600px;margin:20px auto;padding:16px;background:#f8f6f0;border:2px solid #999;color:#222;">
<h3>🎉 登入成功 — 1C 班級網頁 班級網頁</h3>
<p>此頁面為解謎道具。正確密碼 <b>happyland92</b> 已通過（展示版僅接受演示登入）。<br>
完整 6B 班網截圖見 <a href="/hces-quest-site/home/assets/hces-6b-full.png" style="color:#00e;">hces-6b-full.png</a>。</p>
</div>/body></html>
