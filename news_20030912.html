<tr><td class="content"><h3>校園環境消毒通知</h3>
<p class="small">公告日期：2003/09/12</p>
<p>因暑期後校園環境整理需要，學校將於週末進行全面清潔及消毒。</p>
<p>若聞到異味，請立即通知老師或總務處，不自行打開門窗或進入封閉空間。</p>
<p>請師生暫勿進入北側校舍後方通道，並將各班垃圾及回收物於放學前清出。</p></td></tr>
